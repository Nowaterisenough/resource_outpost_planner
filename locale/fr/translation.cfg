output_balance_tooltip=Ajoutez un équilibre d'étiquette à l'emplacement de sortie sélectionné. Défauts à 8 étiquettes pour quatre wagons chargés sur les deux côtés. Vous pouvez modifier le nombre; désactivé par défaut. Utilisez l'emplacement pour choisir l'emplacement et R / Shift+R pour tourner.
output_balance_count_error=Saisissez un nombre entier de convoyeurs de sortie entre 1 et __1__.
output_balance_input_count_error=L’équilibre prend en charge __1__ Les Beltes entrantes.
output_balance_equipment=Aucun splitter compatible ou une ceinture souterraine n'est disponible pour ce type de ceinture.
output_balance_reference_equipment=La référence __1__- à -__2__ l'équilibre a besoin de plus longs cintures souterraines. Choisissez un niveau de cinturon supérieur ou un autre chiffre de sortie.
output_balance_layout=Il ne peut pas générer un __1__- à -__2__ Un équilibre avec ce matériel.
output_balance_blocked=L'équilibre de sortie est bloqué. déplacer ou tourner la sortie, ou ajuster les paramètres de terrain.
