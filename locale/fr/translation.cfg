choice_beacon=Réservez des lignes continues de beacon sur les deux côtés de chaque colonne de fermentation, partageant des lignes entre les colonnes adjacentes.\nLes cinturons souterrains traversent les lignes; les entrées fluides utilisent des canaux de pipe réservés.\nRespecter l'eau sélectionnée, le cliff et éviter les obstacles; les positions de ligne bloquées apparaissent rouges dans la prévision.\nLes boîtes électriques ont une zone minérale plus petite. l'oreille inaccessible sous les lignes apparaît également rouge; utilisez de grandes boîtes ou ajustez la sélection.
beacon_rows=Arrangement : des lignes complètes sur les deux côtés
beacon_row_blocked=La ligne Beacon est bloquée. ajuster les paramètres de sélection ou d'obstacle.
beacon_row_unreachable=Les drills ne peuvent pas atteindre cette ore. ajuster la sélection ou utiliser de grands drills.
choice_beacon_module=Remplissez automatiquement les beacons placés avec ce module et la qualité.\nSeuls les modules acceptés par le beacon sont disponibles. les modules d'extraction ont un sélecteur distinct à côté de l'équipement.
preview_beacons=Les Beacons : __1__et couverture __2__/__3__ Les drills.
beacon_density_1=Basse: objectif 1 par drill
beacon_density_2=Médium : objectif 2 par drill
beacon_density_4=Dénse : objectif 4 par drill
beacon_density_fill=Remplir l’espace disponible
choice_beacon_density=Densité de beacon : les tours désirées affectant chaque boue; défauts à 4.\nContinuez à ajouter des tours après la couverture initiale. remplir l'espace disponible utilise chaque position disponible qui peut encore fournir des effets.\nLa couverture horaire, le terrain, les itinéraires de sortie et la puissance peuvent limiter la densité; les tours partagées peuvent dépasser l'objectif pour certains entraînements.\nEffets utilisent le profil d'atténuation natif. Vérifier les charges de ceinture après augmentation de la densité.
preview_beacon_density=Chaque boule a des effets de __1__ à __2__ les tours.
choice_remove_entities=Activé: marque les installations d'obstruction pour la déconstruction sur Apply; Undo annule de nouvelles commandes.\nDisabled: Réserver et éviter les installations. Les arbres, les rochers, les falaises et le terrain ont des contrôles indépendants.
dumb_power_connectivity=Utiliser des connexions réseau de puissance simplifiées
choice_cliff_mode_avoid=Les couches : éviter.\nLes barrages, les beacons et les connexions évitent les clifs sans ordres de démolition.\nCliquez sur Changer pour supprimer les clifs.
choice_cliff_mode_remove=Clavier : supprimer\nPermettre des layouts sur les clifs; Apporter les commandes de démolition dans les empreintes planifiées.\nCliquez pour changer pour éviter les clifs.
choice_terrain_mode_avoid=Les piscines d'eau / lava / éclairage : éviter.\nLes rides, les beacons et les connexions éviter ces plaques sans remplir les fantômes.\nCliquez pour passer à remplir.
choice_terrain_mode_fill=Poissons d'eau / lava / éclairage : remplir.\nPermettez les layouts sur le terrain remplissable; Appliquez les lieux appropriés, les fondations ou les fantômes de plateforme.\nLes plaques incomplètes restent des obstacles et apparaissent rouges lorsqu'elles sont bloquées.\nCliquez sur Changer pour éviter.
choice_avoid_obstacles=Évitez la lave, l'eau, les clifs, les arbres, les roches et les installations existantes.\nLe débarquement et l’élimination des obstacles.\nArrêtez les connexions non sécurisées ou les placements bloqués.
choice_statistics=Afficher les statistiques de layout.\nAprès Appliquer, imprimez le nombre de freins, les lignes d'emballage internes, les panneaux de ressources et les ressources manquées.\nDans le mode ALT, affichez la production et l'utilisation estimée de la capacité de chaque côté de la ceinture, le nombre de ceinture de sortie et la perte de bouteille dans les prévisions et les layouts appliqués.\n100% est plein; les valeurs supérieures à 100% sont rouges. estimations de puissance entière utilisent des modules de fermentation et de beacon, la productivité minérale et le stacking.\nLa désactivation de cette option arrête les rapports de placement et les écrans de charge de la barre; il ne change que l'affichage, pas le layout.
choice_merge_belts=Mettre en place des cents à faible rendement
choice_belt_planner=Placez ou déplacez la sortie avec __CONTROL__build__. R / Maj+R la fait pivoter. Cliquez à nouveau ou appuyez sur __CONTROL__clear-cursor__ pour conserver sa position. Les raccordements sont construits à la validation.
choice_use_stack_capacity_multiplier=Utilisez la capacité d'assainissement de ceinture recherchée dans la surface de traversée.\n(Pendant Lua API pour le faire automatiquement pour chaque minier)
label_auto_resource=Utiliser automatiquement les paramètres minéraux ou pétroliers pour les ressources sélectionnées
label_oil_only_pole=Non disponible pour le layout actuel des mines; sélectionné en mode pétrole.
label_miner_layout_switch=Ce boîtier ne correspond pas à l'établissement actuel. Sélectionner le switch à un layout compatible.
label_rotate_keybind_tip=Tournez avec __CONTROL__resource-outpost-planner-keybind-rotate__ ou __CONTROL__resource-outpost-planner-keybind-rotate-reversed__ lorsque le pointeur ne survole pas d’entité.
