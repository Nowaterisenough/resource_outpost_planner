belt_planner_name=Planificateur de sortie
belt_planner_description=Le cursor de l'impression d'écran affiche les lignes de sortie actuelles. Cliquez pour définir leur localisation; R / Shift+R tourne l'impression d'écran. Les connexions de prévision ne sont construites que après Application.
