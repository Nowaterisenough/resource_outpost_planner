choice_clear_cliffs=Activé : marquer les clips d’obstruction pour la démolition sur Apply.\nDisabled: Réserver et éviter les falaises. indépendante des arbres, rochers et installations.
choice_fill_water=Activé : place appropriée de remplir les fantômes sous des entités planifiées sur l'eau (plateformes glace sur les océans amoniaques d'Aquilo).\nDisabled: évite l'eau. ne change pas les paramètres de lava ou de l'océan pétrolier.
choice_fill_lava=Activé : place des fantômes de fondation sous les entités planifiées sur la lave.\nDisabled: évite lava. ne change pas les paramètres de l'eau ou de l'océan pétrolier.
choice_fill_oil_ocean=Activé : remplir les océans pétroliers et les piscines de lumière modes où il existe une couverture.\nDisabled: éviter ces plaques. plaques incomplètes restent toujours des obstacles.
choice_fill_other=Activé : remplir d’autres terrains couverts, y compris les plateformes spatiales.\nLes lacunes incomplètes et les bords de la carte restent toujours des obstacles.
choice_remove_trees=Activé : marquer les arbres d'obstruction pour la déconstruction sur Application.\nLes personnes handicapées : conserver et éviter les arbres. indépendants des installations et des roches.
choice_remove_rocks=Activé : marquer les roches d'obstruction pour la déconstruction sur Apply.\nDisabled: Réserver et éviter les roches. indépendante des installations et des arbres.
