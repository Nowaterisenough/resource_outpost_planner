preview_force_tooltip=Force le placement comme Maj+clic et marque les obstacles naturels pour déconstruction. Avec la suppression des installations activée, ou Ctrl+Maj+clic, les bâtiments gênants sont également marqués. Les robots exécutent les travaux. Le remblai suit les règles des plans du jeu. Les éléments impossibles à placer restent rouges pendant 10 secondes.
