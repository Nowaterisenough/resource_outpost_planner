belt_load_max=Charge maximale
belt_load_tooltip=1 correspond à 100 %, 1.1 à 110 %. Sous la charge moyenne minimale, les convoyeurs sont regroupés. Si un côté dépasse le maximum, les rangées sont divisées. Les dernières rangées peuvent rester sous le minimum. Le calcul tient compte des modules, des diffuseurs, de la recherche et de l’empilage. Le nombre de sorties demandé, ou le nombre de wagons et de côtés de chargement, est prioritaire. Si la capacité est insuffisante, le plan indique la perte estimée et reste applicable. Resélectionnez le gisement pour modifier sa disposition.
belt_load_invalid=Plage de charge valide : 0 ≤ min ≤ max ≤ 100, max > 0. Par exemple, 0,8 et 1,1 correspondent à 80 % et 110 %.
belt_capacity_single=Une boîte produit __1__/s, au-dessus de la charge autorisée de recevoir-lan de __2__Choisissez une ceinture plus rapide, réduisez les effets de vitesse ou augmentez la charge maximale.
belt_capacity_dense=Le tracé compact laisse deux cases aux convoyeurs. Perte de débit estimée : __1__ %. Appliquez le plan, choisissez des convoyeurs plus rapides ou ralentissez les foreuses.
belt_capacity_outputs=Le plan conserve les __1__ sorties demandées. Perte de débit estimée : __2__ %. Vous pouvez appliquer le plan.
belt_capacity_space=Les lances de collecte supplémentaires laissent les mines précédemment couvertes hors de la gamme minière. Sélectionnez un patch plus étroit, choisissez une ceinture plus rapide ou augmentez la charge maximale.
belt_capacity_route=Il n'y a pas assez de portée sous-terrestre ou de nettoyage pour les lignes de collecte indépendantes. Choisissez un niveau plus élevé de ceinture ou ajustez l'équipement.
belt_capacity_geometry=La géométrie de la sortie ou du fluide-port n'est pas soutenue par la division de capacité. modifier la sortie ou désactiver la division.
