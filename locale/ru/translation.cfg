output_balance_reference_equipment=Референт __1__То-__2__ Балансер нуждается в более длинных подземных поясах. Выберите более высокий уровень пояса или другое количество выхода.
output_balance_layout=Не может быть создано __1__То-__2__ Баланс с этим оборудованием.
