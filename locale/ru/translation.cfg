choice_clear_cliffs=Включен: маркируйте препятствующие клипы для демонтажа на Применение.\nинвалид: сохраняйте и избегайте скал. Независимо от деревьев, скал и объектов.
choice_fill_water=Умерен: разместить подходящие призраки под запланированными существами на воде (платформы льда на амоняльных океанах Аквило).\nинвалид: избегать воды. не меняет лавы или нефтяных океанских настроек.
choice_fill_lava=Умерен: разместить фундаментальные призраки под запланированными существами на лаве.\nинвалид: избегайте лавы. не меняет водных или нефтеокеанских настроек.
choice_fill_oil_ocean=Уменен: заполнить нефтяные океаны и моддированные ламповые бассейны, где существует покрытая ткань.\nС инвалидностью: избегайте этих плиток. Невыполняемые плиты всегда остаются препятствиями.
choice_fill_other=Включен: заполните другие покрытые участки, в том числе пространственные платформы.\nНевыполняемая пустота и краины карты всегда остаются препятствиями.
choice_remove_trees=Удобен: маркировка препятствующих деревьев для деконструкции на Применение.\nинвалиды: сохраняют и избегают деревьев, независимо от объектов и скал.
choice_remove_rocks=Включен: маркируйте препятствующие скалы для деконструкции на Применение.\nинвалидность: сохранение и избегание скал. Независимо от объектов и деревьев.
ore_filter_resource_tooltip=Выберите ресурс для шахты и продукт, чтобы пройти через фильтрованные разделители.
ore_filter_select=Выберите ресурс рядом с фильтром, прежде чем применять план.
