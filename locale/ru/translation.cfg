output_balance_tooltip=Добавьте баланс пояса в выбранное место выхода. дефекты до 8 поясов выхода для четырех грузовых вагонов, загруженных с обеих сторон. Вы можете изменить число; деактивировать по умолчанию. Используйте выход для выбора места и R / Shift+R для поворота.
