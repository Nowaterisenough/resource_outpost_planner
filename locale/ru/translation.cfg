settings_oil_label=Нафтовые установки
settings_shared_label=Объединенные настройки
settings_layout_choice_oil=Оливковая выброса
choice_beacon=Резервируйте непрерывные ряды бекон на обеих сторонах каждой колонны бутылки, делайте ряды между соседними колоннами.\nПодземные поясы пересекают строки; вводимые жидкости используют резервные трубопроводные каналы.\nУважайте выбранную воду, скалы и избегайте препятствий; блокированные позиции строки появляются красными в пересмотре.\nЭлектрические трейлеры имеют меньшую площадь добычи. Недоступные орехи под строками также появляются красными; используйте большие трейлеры или корректируйте выбор.
beacon_rows=Устройство: полные строки с обеих сторон
beacon_row_blocked=Beacon ред блокирован. корректировать настройки выбора или препятствия.
beacon_row_unreachable=Трельги не могут достичь этого уровня. корректировать выбор или использовать большие трельги.
choice_beacon_module=Заполните автоматически размещенные беканы этим модулем и качеством.\nДоступны только модули, принятые беаконом.Экстракционные модули имеют отдельный селектор рядом с оборудованием.
preview_beacons=В Бейонсе : __1__, покрытие __2__/__3__ и трейлеров
beacon_density_1=Низкий: цель 1 по трейлеру
beacon_density_2=Средний показатель: цель 2 по трейлеру
beacon_density_4=Тенс: цель 4 по трейлеру
beacon_density_fill=Заполните доступное пространство
choice_beacon_density=плотность бекон: желаемые башни, затрагивающие каждую буриль; дефолты до 4.\nПродолжайте добавлять башни после первоначального покрытия.Заполните доступное пространство использует каждую доступную позицию, которая все еще может обеспечить эффекты.\nЧасовое покрытие, терен, маршруты выхода и мощность могут ограничивать плотность; совместные башни могут превышать цель для некоторых тренировок.\nЭффекты используют индийский профиль ослабления. проверьте нагрузки пояса после увеличения плотности.
preview_beacon_density=Каждый трейлер получает эффекты от __1__ Для __2__ и башни .
choice_remove_entities=Включен: маркируйте блокирующие объекты для деконструкции на Применение; Undo отменяет новые заказы.\nС инвалидностью: сохранять и избегать объектов. деревья, скалы, скалы и земли имеют независимый контроль.
dumb_power_connectivity=Использование упрощенных сетевых соединений
choice_cliff_mode_avoid=Клипы – избегать\nСтрельбы, беконы и соединения избегают скалп без заказов по демонтированию.\nНажмите, чтобы перейти, чтобы удалить клипы.
choice_cliff_mode_remove=Клипы: удалить их\nДозвольте расположения через клипы; Применить заказы сброса в рамках запланированных отпечатков.\nНажмите, чтобы перейти, чтобы избежать клипов.
choice_terrain_mode_avoid=Вода / лава / светящиеся бассейны: избегайте.\nСтрелки, беконы и соединения избегают этих плиток без наполнения призраков.\nНажмите, чтобы перейти на заполнение.
choice_terrain_mode_fill=Вода / лава / светящиеся бассейны: заполните.\nДозвольте размещения по заполняемому участку; Применяйте место для соответствующих ландшафтов, фундамента или платформы призраков.\nНевыполняемые плиты остаются препятствиями и появляются красными, когда они заблокированы.\nНажмите, чтобы перейти, чтобы избежать.
choice_avoid_obstacles=Избегайте лавы, воды, скал, деревьев, скал и существующих объектов.\nПреодолевает поломки и удаление препятствий.\nПрекратите безопасные соединения или бронетехники блокируются.
choice_statistics=Показать статистику расположения.\nПосле применения, печатать бронирование бутылок, внутренние резьбы пояса, ресурсные плиты и пропущенные ресурсы.\nВ режиме ALT отображается предполагаемая производительность и использование мощности каждой стороны пояса, выброс пояса выхода и потери бутылки в прогнозах и прикладных расположениях.\n100% полный; ценности выше 100% красные. оценки полной энергии используют буровые и беконные модули, продуктивность шахт и стакинг.\nОтключение этой опции останавливает как отчеты о размещении, так и дисплеи нагрузки пояса; меняет только дисплей, а не расположение.
choice_use_stack_capacity_multiplier=Используйте проанализированную емкость пояса в проходном перекрытии.\n(подъем Lua API, чтобы сделать это автоматически для каждой шахты)
label_auto_resource=Автоматически использует поставки шахты или нефти для выбранных ресурсов
label_oil_only_pole=Недоступно для текущего расположения шахты; подбирается в нефтяном режиме.
label_miner_layout_switch=Этот трейлер не соответствует текущему расположению. Выбор его переходит на совместимый расположение.
label_optional_equipment_toggle=Нажмите, чтобы включить; снова нажмите активное оборудование или правой кнопкой нажмите, чтобы отключить.
