output_settings_label=Выход
output_tool_tooltip=Нажмите, чтобы разместить выходы пояса или конфигурированную станцию зарядки. R / Shift+R вращается; H / V флип предварительный просмотр. Apply строит строительный план.
output_station_label=Генерация станции зарядки
output_station_tooltip=После балансира размещаются рельсы, остановка, буферные сундуки, манипуляторы и опоры. При экспресс- или турбоконвейерах и двусторонней погрузке входной поток сначала выравнивается. На вагон приходится шесть линий с переходами под рельсами. Четыре вагона получают 24 равных потока даже при неравномерной подаче или остановке части входов. В остальных схемах используется одна лента на вагон с каждой стороны погрузки. По умолчанию: два локомотива, четыре вагона, погрузка с обеих сторон.
