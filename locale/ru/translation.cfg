ore_filter_equipment=Для выбранного пояса нет разделителя соответствия скорости.Выберите другой пояс или отключите фильтр шерсти.
ore_filter_space=Не хватает четкого пространства для изолированных фильтрационных разделителей. Сделайте выбор, контрольные участки или выход.
