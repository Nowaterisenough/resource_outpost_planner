belt_load_tooltip=1 означает 100 %, а 1.1 — 110 %. При средней загрузке ниже минимума ленты объединяются. Если любая сторона ленты превышает максимум, ряды разделяются. У крайних рядов загрузка может оставаться ниже минимума. Расчёт учитывает модули, маяки, исследования и ярусы предметов на лентах. Заданное число выходов либо вагонов и сторон погрузки имеет приоритет. При нехватке пропускной способности показывается оценка потерь, план можно применить. Чтобы изменить расположение буров, выделите месторождение заново.
belt_load_invalid=Допустимый диапазон: 0 ≤ минимум ≤ максимум ≤ 100, максимум > 0. Например, 0.8 и 1.1 означают 80 % и 110 %.
belt_capacity_single=Один трейлер производит __1__/s, выше разрешенной нагрузки получателя-леона __2__Выберите более быстрый пояс, уменьшите эффекты скорости или увеличите максимальную нагрузку.
belt_capacity_dense=В компактной схеме под ленты отведены две клетки. Ожидаемая потеря пропускной способности: __1__ %. Можно применить план, ускорить ленты или замедлить буры.
belt_capacity_outputs=Сохранено заданное число выходов: __1__. Ожидаемая потеря пропускной способности: __2__ %. План можно применить.
belt_capacity_space=Дополнительные каналы сборки оставляют заранее покрытые руды из добычи. Выберите более узкую пачку, выберите более быстрый пояс или увеличить максимальную нагрузку.
belt_capacity_route=Недостаточно подземного пояса или очистки для независимых цепочек сбора. Выберите более высокий уровень пояса или корректируйте оборудование.
belt_capacity_geometry=Выход или геометрия жидкости-порта этого бутылка не поддерживается разделительными способностями. Изменить бутылку или отключить раздел.
