choice_avoid_obstacles=避开岩浆、水域、悬崖、树木、岩石和现有设施。\n开启后优先绕行，不自动填土或拆除障碍。\n无法安全连接的位置会停止规划或跳过放置。
choice_force_pipe_placement=强制管道放置
choice_print_placement_info=打印放置信息
choice_display_lane_filling=ALT 模式下显示矿道饱和度覆盖。\nGUI 关闭后会淡出\n（持续时间可在 mod 设置中调整）
choice_merge_belts=合并低产出的传送带
choice_belt_planner=在创建布局后会提供传送带规划器\n使用该规划器进行一次 __CONTROL__build__ 操作，即可将传送带铺设至目标位置。\n__CONTROL_RIGHT_CLICK__ 点击此图标可再次获取上一个传送带规划器。
choice_use_stack_capacity_multiplier=在吞吐量覆盖显示中使用已研究的传送带堆叠容量。\n（等待 Lua API 支持按每台矿机自动计算）

