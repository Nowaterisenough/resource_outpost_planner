choice_none=无
choice_beacon=在每列矿机两侧预留连续整排插件塔，相邻矿机列共享塔排。\n传送带用地下段穿过塔排，流体输入使用预留的管道通道。\n遵循“地形与设施”中的选择；塔排受阻的位置在预览中标红。\n普通矿机开采范围较小，塔下够不到的矿格也会标红，可改用大型矿机。
beacon_rows=排列：矿机两侧整排
beacon_row_blocked=插件塔排受阻，请调整矿区范围或避障设置。
beacon_row_unreachable=矿机够不到此矿格，可调整范围或改用大型矿机。
choice_beacon_module=为自动放置的插件塔装满此插件，可单独选择插件品质。\n只显示插件塔允许安装的插件；开采设备的插件使用设备旁边的独立选择。
preview_beacons=插件塔：__1__ 座，覆盖 __2__/__3__ 台矿机。
beacon_density_1=少量：每台目标 1 座
beacon_density_2=适中：每台目标 2 座
beacon_density_4=密集：每台目标 4 座
beacon_density_fill=尽量铺满
choice_beacon_density=插件塔密度：选择每台矿机希望受到几座塔影响，默认 4 座。\n达到一次覆盖后会继续补塔；“尽量铺满”会使用所有能继续提供效果的可用塔位。\n实际数量受矿石覆盖、地形、出带通路和供电限制，共享塔可能使部分矿机超过目标。\n多塔效果按游戏衰减系数计算，增加密度后请检查传送带负载。
preview_beacon_density=每台矿机受到 __1__ 至 __2__ 座塔影响。
choice_none_zero=无电杆间隙
choice_lamp=放置灯光
choice_coverage=多放矿机。\n更积极地在矿区边缘和稀疏位置放置矿机，开采范围允许更多重叠。\n可增加同时开采的矿机数量，也会增加设备和传送带用量。
choice_landfill=省略填土
choice_start=对齐矿区起点
choice_deconstruction=保留已有设施、树木和岩石。\n悬崖按“避／拆”选择执行，水、岩浆、雷池按“避／补”选择执行。
dumb_power_connectivity=使用简化的电网连接方式
choice_ore_filtering=省略不需要的矿物
choice_avoid_water=避免放置在水上
choice_avoid_cliffs=避免放置在悬崖上
choice_cliff_mode_avoid=悬崖：避让。\n矿机、插件塔和连接线路绕开悬崖，不下达悬崖拆除命令。\n点击切换为拆除悬崖。
choice_cliff_mode_remove=悬崖：拆除。\n允许布局经过悬崖；应用后对占用位置下达悬崖拆除命令。\n点击切换为避让悬崖。
choice_terrain_mode_avoid=水／岩浆／雷池：避让。\n矿机、插件塔和连接线路绕开这些地形，不放置填补蓝图。\n点击切换为填补。
choice_terrain_mode_fill=水／岩浆／雷池：填补。\n允许布局跨越可填补地形；应用后按地形放置填土、地基或平台蓝图。\n不可填补的位置仍视为障碍并标红。\n点击切换为避让。
choice_avoid_obstacles=避开岩浆、水域、悬崖、树木、岩石和现有设施。\n开启后优先绕行，不自动填土或拆除障碍。\n无法安全连接的位置会停止规划或跳过放置。
choice_force_pipe_placement=强制管道放置
choice_statistics=显示布局统计。\n应用后打印矿机数量、内部传送带行数、资源格数及遗漏提示。\n开启 ALT 模式，在预览和已应用布局中显示传送带每侧的预计产量、容量占用率，以及出口带数和瓶颈损失。\n100% 表示满载，超过 100% 标红；按矿机和插件塔的插件、采矿产能研究及堆叠能力估算满电产量。\n关闭后同时停止放置报告和传送带负载显示；仅控制信息显示，不改变布局。
choice_merge_belts=合并低产出的传送带
choice_belt_planner=点击进入输出放置模式，蓝图光标按当前输出带数显示传送带。\n用 __CONTROL__build__ 点击地图设置或移动出口；R / Shift+R 旋转。\n再次点击或按 __CONTROL__clear-cursor__ 退出，保留已选出口。\n连接路线遵循“地形与设施”的选择，应用后才施工。\n需要先生成带传送带的矿区预览，也可连接最近一次应用的矿区。
choice_use_stack_capacity_multiplier=在吞吐量覆盖显示中使用已研究的传送带堆叠容量。\n（等待 Lua API 支持按每台矿机自动计算）

