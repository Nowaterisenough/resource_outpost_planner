[mod-name]
resource-outpost-planner=资源开采规划器

[mod-description]
resource-outpost-planner=规划矿区和油田，先生成机器人不会施工的地面预览。实时调整配置、避开障碍，确认后再应用建设蓝图。

[item-name]
resource-outpost-planner=资源开采规划器

[item-description]
resource-outpost-planner=使用 __CONTROL__build__ 框选资源，预览采矿或油田布局。\n修改配置会更新预览，点击“应用”后才生成建设蓝图；机器人不会施工预览。\n通过 __CONTROL_KEY_SHIFT____CONTROL_STYLE_BEGIN__ + __CONTROL_STYLE_END____CONTROL__build__ 添加资源。“取消预览”只丢弃当前草稿。

[shortcut-name]
resource-outpost-planner-shortcut=资源开采规划器

[controls]
resource-outpost-planner-keybind=打开资源开采规划器
resource-outpost-planner-keybind-rotate=旋转规划方向
resource-outpost-planner-keybind-rotate-reversed=反向旋转规划方向

