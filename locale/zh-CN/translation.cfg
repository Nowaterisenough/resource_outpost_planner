[mod-name]
mining-patch-planner=资源开采规划器

[mod-description]
mining-patch-planner=规划矿区和油田，先生成机器人不会施工的地面预览。实时调整配置、避开障碍，确认后再应用建设蓝图。

[item-name]
mining-patch-planner=资源开采规划器

[item-description]
mining-patch-planner=使用 __CONTROL__build__ 框选资源，预览采矿或油田布局。\n修改配置会更新预览，点击“应用”后才生成建设蓝图；机器人不会施工预览。\n通过 __CONTROL_KEY_SHIFT____CONTROL_STYLE_BEGIN__ + __CONTROL_STYLE_END____CONTROL__build__ 添加资源。“取消预览”只丢弃当前草稿。

[shortcut-name]
mining-patch-planner-shortcut=资源开采规划器

[controls]
mining-patch-planner-keybind=打开资源开采规划器
mining-patch-planner-keybind-rotate=旋转规划方向
mining-patch-planner-keybind-rotate-reversed=反向旋转规划方向

[mod-setting-name]
mpp-performance-scaling=性能缩放
mpp-lane-filling-info-duration=矿道饱和度显示持续时间（秒）
mpp-dump-heuristics-data=调试：导出状态信息以供检查

[mod-setting-description]
mpp-lane-filling-info-duration=在规划器 GUI 关闭后开始显示持续时间
mpp-performance-scaling=每tick计算量的倍数。\n设为小于 1 可减少卡顿。\n（可在 F4 → show-time-usage → mining-patch-planner 中查看时间占用情况）

