super_compact_wire=Суперкомплексні великі дріллі вимагають полярного провільного доступу принаймні __1__ Виберіть середній полюс або підвищити його якість.
super_compact_underground=Суперкомплексні великі трейлери вимагають підземних кінцевих точок принаймні __1__ Виберіть довгий підземний пояс.
ore_filter_placeholder=Вибір ресурсів
fill_research_warning_caption=[img=utility/warning_icon] [color=255,190,80]__1__[/color]
fill_research_warning=Завантажити не відключено: __1__.\nВи все ще можете надати цю можливість, перегляд і розташування будівельних привидів.Будівництво вимагає відповідних матеріалів; ніяких досліджень не надається.
preference_fill_water=Наповнення води
preference_fill_lava=Доповнений лава
preference_fill_oil_ocean=Нафтові океани / басейни
preference_fill_other=Завантажити інший / простір
preference_remove_trees=Зняти дерева
preference_remove_rocks=Зняти камені
choice_clear_cliffs=Увімкнено: ознака перешкодливих стовпів для демонтажу на Прикладі.\nІнвалідність: зберігати і уникати скелі. Незалежно від дерев, каменів і об'єктів.
choice_fill_water=Увімкнуто: розміщувати привидів під планованими суб'єктами на воді (лідні платформи на амонійних океанах Акіло).\nНе змінює лави або нафтового океану.
choice_fill_lava=Увімкнуто: розміщення фундаментальних привидів під планованими суб'єктами на лаві.\nНедостатньо: уникнути лави. не змінює налаштування води або нафтового океану.
choice_fill_oil_ocean=Увімкнено: заповнюйте нафтові океани і модифіковані лампові басейни, де існує покриття.\nНедостатньо: уникнути цих плиток.Незаповнені плитки завжди залишаються перешкодами.
choice_fill_other=Включено: заповнити інші покриті території, в тому числі космічні платформи.\nНедостатня вакуум і країни картки завжди залишаються перешкодами.
choice_remove_trees=Увімкнено: ознака обмежувальних дерев для деконструкції на Прикладі.\nІнваліди: зберігати і уникати дерев. Незалежно від об'єктів і скель.
choice_remove_rocks=Увімкнено: ознака обструкційних скель для деконструкції на Прикладі.\nІнвалідність: зберігати і уникати каменів. Незалежно від об'єктів і дерев.
ore_filter_resource_tooltip=Виберіть ресурс для видобутку і продукт, щоб пройти через фільтровані розділи.
ore_filter_select=Виберіть ресурс поруч з Filter ore, перш ніж застосовувати план.
ore_filter_missing=Вибрана територія не має мінеральних __1__Виберіть інший ресурс або область.
ore_filter_equipment=Для вибраного пояса не доступний розчинник зі швидкістю відповідності.Виберіть інший пояс або відключіть фільтрацію.
ore_filter_space=Не достатньо чіткого простору для ізольованих фільтрових розчинників. Змінюйте вибір, контрольні ділянки або вихід.
tool_output=Вказати вихід
belt_load_hint=1 = 100% навантаження; 1.1 = 110%.
