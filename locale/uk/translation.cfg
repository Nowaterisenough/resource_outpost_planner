output_balance_equipment=Для цього типу поясу не доступно жодного сумісного розчинника або підземного поясу.
output_balance_reference_equipment=Референтність __1__- до -__2__ Балансер потребує більш довгих підземних поясів. Виберіть вищий рівень поясу або інший розрахунок виходу.
output_balance_layout=Не може бути створено __1__- до -__2__ Збалансований пояс з цим обладнанням.
output_balance_blocked=Вихідний баланс заблокований. перемістити або обертати вихід, або встановити наземні налаштування.
output_settings_label=Вихід
