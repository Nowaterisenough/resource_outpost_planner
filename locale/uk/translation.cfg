settings_layout_choice_throughput_t1=Створення T1
choice_beacon=Зареєструйте постійні смуги на обох боках кожної колонки, поділяючи смуги між сусідніми колонками.\nПідземні пояси перетинають рядки; рідкісні входи використовують зарезервовані трубопровідні канали.\nПовага до вибраної води, скелі та уникнення перешкод; блоковані положення ряду з'являються червоними в перегляді.\nЕлектричні трейлери мають меншу зону видобутку. Недоступні орі під рядками також з'являються червоними; використовуйте великі трейлери або налаштуйте вибір.
beacon_rows=Розпорядження: повні рядки з обох сторін
beacon_row_blocked=Beacon ряд блокований. налаштування вибору або перешкод.
beacon_row_unreachable=Драйли не можуть досягти цієї мети. Змінити вибір або використовувати великі драйли.
choice_beacon_module=Автоматично заповнюйте розміщені баки цим модулем і якістю.\nМодулі екстракції мають окремий селектор поряд з обладнанням.
preview_beacons=У Бейконі: __1__, покриття __2__/__3__ Трейлер →
beacon_density_1=Низький: ціль 1 за драйл
beacon_density_2=Середній: ціль 2 за драйл
beacon_density_4=Мета: 4 за драйл
beacon_density_fill=Завантажити доступний простір
choice_beacon_density=щільність бікон: бажані вежі, що впливають на кожну бульбу; дефолти до 4.\nПродовжуйте додавати вежі після початкового покриття. заповнити доступний простір використовує кожну доступну позицію, яка все ще може забезпечити ефекти.\nОбкладинка годин, земля, маршрути виходу і енергія можуть обмежити щільність; спільні вежі можуть перевищувати мету для деяких трейлів.\nЕфекти використовують вроджений профіль ослаблення. Перевірте завантаження поясу після збільшення щільності.
preview_beacon_density=Кожен трейлер отримує ефекти від __1__ до __2__ Таурів
choice_none_zero=Не вистачає потужності поля
choice_start=Створення Patch Start
choice_remove_entities=Увімкнено: ознака обструкційних об'єктів для деконструкції на Заяву; Undo скасовує нові замовлення.\nІнваліди: зберігати і уникати об'єктів. дерева, камені, скелі та земля мають незалежний контроль.
choice_deconstruction=Зберігайте існуючі об'єкти, дерева і камені.\nУсунення кліфу і заповнення землі слідкують за власними контролями режиму.
dumb_power_connectivity=Використання спрощених мережевих підключень
choice_ore_filtering=Виберіть ресурс поруч з цим контрольним ящиком. дріллі спрямовані на вибраний ресурс, і кожен вихідний пояс отримує відповідний фільтрований розчинник перед маршрутизацією або балансуванням виходу.\nТільки вибраний ресурсний продукт входить до основного виходу. інший порт розщепника зберігається окремо; підключити його до окремого зберігання, якщо накопичується небажана гілка.\nЛогістичні розташування використовують виключення зони буріння без розщепників.
choice_avoid_water=Уникайте розміщення на воді
choice_avoid_cliffs=Уникайте розміщення на скелях
choice_cliff_mode_avoid=Кліф: уникнути цього\nШтрихи, бікони і зв'язки уникають скелі без замовлень на демонтажу.\nНатисніть, щоб перейти, щоб видалити клітини.
choice_cliff_mode_remove=Кліф: Зніміть його\nДозвольте розташування через скелі; Використовуйте замовлення знеструмлення в межах запланованих відбитків.\nНатисніть, щоб перейти, щоб уникнути стовпів.
choice_terrain_mode_avoid=Водяний / лава / світлодіодний басейн: уникнути.\nДрілки, бікони і зв'язки уникають цих плиток без заповнення привидів.\nНатисніть, щоб перейти до заповнення.
choice_terrain_mode_fill=Водяний / лава / світлодіодний басейн: заповнити.\nДозвольте розташування по заповненому майданчику; Прикладіть місце відповідних ландшафтів, фундаментів або платформ привидів.\nНевиповнені тарілки залишаються перешкодами і з'являються червоними, коли блоковані.\nНатисніть, щоб перейти, щоб уникнути.
choice_avoid_obstacles=Уникайте лави, води, скелі, дерев, каменів і існуючих об'єктів.\nПеревищує землетруси і усуває перешкоди.\nЗатримати небезпечні зв'язки або заблокувати блоковані плаценти.
choice_force_pipe_placement=Сила трубопроводу
choice_statistics=Показати статистику розкладу.\nПісля застосування, друкуйте розраховування бульварів, внутрішні поясні рядки, ресурсні плитки та відсутні ресурси.\nУ режимі ALT показує оцінювану продукцію і використання потужності кожної сторони поясу, розрахунок вихідного поясу та втрата пляшки в попередніх переглядах та застосованих розташуваннях.\n100% повний; значення вище 100% червоні. ціни повної потужності використовують модулі буріння і бікон, продуктивність шахт і стягування.\nВимкнення цієї опції зупиняє як звіти про розміщення, так і поясні навантаження дисплеїв; змінюється тільки дисплей, а не розташування.
choice_merge_belts=З'єднайте низькооплачувані пояси
choice_belt_planner=Укажіть або пересуньте вихід за допомогою __CONTROL__build__. Поворот: R / Shift+R. Клацніть знову або натисніть __CONTROL__clear-cursor__, щоб зберегти позицію. З’єднання будуються після застосування плану.
choice_use_stack_capacity_multiplier=Використовуйте досліджену потужність смуги в прохідному перекладі.\n(продовжуючи Lua API для того, щоб зробити це автоматично для кожного видобутку)
label_add_blueprint=Завантажити blueprint
