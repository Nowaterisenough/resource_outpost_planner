belt_load_tooltip=1 означає 100 %, а 1.1 — 110 %. За середнього завантаження нижче мінімуму стрічки об’єднуються. Якщо будь-яка сторона стрічки перевищує максимум, ряди розділяються. Крайні ряди можуть залишатися нижче мінімуму. Розрахунок враховує модулі, маяки, дослідження та яруси предметів на стрічках. Пріоритет має задана кількість виходів або вагонів і сторін завантаження. Якщо пропускної здатності бракує, план показує очікувані втрати й дозволяє застосування. Щоб змінити розташування бурів, знову виділіть родовище.
belt_load_invalid=Допустимий діапазон: 0 ≤ мінімум ≤ максимум ≤ 100, максимум > 0. Наприклад, 0.8 і 1.1 означають 80 % і 110 %.
belt_capacity_single=Один трейлер виробляє __1__/s, вище дозволеного навантаження приймаючої лінії __2__Виберіть більш швидкий пояс, зменшити ефекти швидкості або збільшити максимальну навантаження.
belt_capacity_dense=У компактній схемі для стрічок відведено дві клітини. Очікувана втрата пропускної здатності: __1__ %. Можна застосувати план, вибрати швидші стрічки або сповільнити бури.
belt_capacity_outputs=Збережено задану кількість виходів: __1__. Очікувана втрата пропускної здатності: __2__ %. План можна застосувати.
belt_capacity_space=Додаткові збиральні лінії залишають заздалегідь покриті руди з мінерального діапазону. Виберіть більш вузьку пачку, виберіть швидший пояс або збільшити максимальну навантаження.
belt_capacity_route=Недостатній підземний пояс або очищення для незалежних збиральних проводів. Виберіть вищий рівень поясу або налаштуйте обладнання.
belt_capacity_geometry=Вихід або геометрія поточних портів цього буріння не підтримується розділенням потужності. змінити буріння або відключити розділення.
quality_settings=Налаштування якості
entity_filtering_mode=Вибір фільтрації\nПриховати/не приховати доступні суб'єкти/кваліфікації в GUI з __CONTROL_KEY_SHIFT____CONTROL_STYLE_BEGIN__ + __CONTROL_STYLE_END____CONTROL_RIGHT_CLICK__
