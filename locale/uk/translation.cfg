preview_force_tooltip=Примусове розміщення, як за Shift+клацання. Природні перешкоди позначаються для знесення. Якщо ввімкнено знесення споруд або натиснуто Ctrl+Shift, позначаються також будівлі, що заважають. Знесення виконують будівельні роботи. Для засипання діють правила креслень гри. Нерозміщені об’єкти підсвічуються червоним на 10 секунд.
