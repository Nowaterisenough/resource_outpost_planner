output_balance_tooltip=Додайте баланс пояса на вибраному вихідному місці. Дефекти до 8 вихідних поясів для чотирьох вантажних вагонів, завантажених з обох боків. Ви можете змінити кількість; деактивовано за замовчуванням. Використовуйте вихід, щоб вибрати місце розташування і R / Shift+R для обертання.
