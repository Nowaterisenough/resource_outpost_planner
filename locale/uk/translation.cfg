output_station_label=Створення станції завантаження
output_station_tooltip=Після балансира розміщуються рейки, зупинка, буферні скрині, маніпулятори й опори. Для експрес- або турбоконвеєрів із двобічним завантаженням вхідний потік спершу вирівнюється. На вагон припадає шість ліній із переходами під рейками. Чотири вагони отримують 24 рівні потоки навіть за нерівномірного постачання чи зупинки частини входів. В інших схемах використовується одна стрічка на вагон із кожного боку завантаження. Типово: два локомотиви, чотири вагони, завантаження з обох боків.
