preview_belt_select=Liczba taśmociągów wyjściowych: __1__. Kliknij, aby przenieść wyjście. Obrót: R / Shift+R.
output_balance_label=Równoważ wyjścia
output_balance_unit=pasek
output_balance_tooltip=Dodaj równowagę paska w wybranym miejscu wyjścia. Wady do 8 pasków wyjściowych dla czterech wagonów ładowanych po obu stronach. Możesz zmienić liczbę; nie jest to możliwe według wady. Użyj wyjścia, aby wybrać lokalizację i R / Shift + R do obrotu.
output_balance_count_error=Podaj liczbę całkowitą od 1 do __1__ jako liczbę taśm wyjściowych.
output_balance_input_count_error=Równowaga wspiera do __1__ Wejście na pasek.
output_balance_equipment=Nie ma kompatybilnego paska lub podłogowego paska dostępnego dla tego typu paska.
output_balance_reference_equipment=Referencje __1__- do-__2__ Balancer potrzebuje dłuższych podłogowych pasów. Wybierz wyższy poziom pasów lub inne liczby wyjściowe.
