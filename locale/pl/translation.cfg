output_tool_tooltip=Kliknij, aby umieścić wyjścia pasów lub skonfigurowaną stację ładowania. R / Shift+R rotuje; H / V flip przewidywania.
output_station_label=Generacja stacji ładowania
output_station_tooltip=Za układem równoważącym powstają tory, przystanek, skrzynie buforowe, podajniki i słupy. Przy taśmociągach ekspresowych lub turbo i załadunku z obu stron każdy wagon dostaje sześć równych linii, z przejściami pod torami na drugą stronę. Cztery wagony mają 24 linie także przy nierównych lub zatrzymanych wejściach. W innych konfiguracjach przypada jedna taśma na wagon i stronę. Domyślnie: dwie lokomotywy, cztery wagony, załadunek obustronny.
