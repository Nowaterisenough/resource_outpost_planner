choice_beacon=Rezerwuj ciągłe wiersze na obu stronach każdej kolumny drutowej, dzieląc wiersze między sąsiadującymi kolumnami.\nPodziemne pasy przekraczają rzędy; płynowe wejścia wykorzystują zastrzeżone kanały rur.\nSzanuj wybrane wody, klipy i unikanie przeszkód; blokowane pozycje rzędu pojawiają się czerwone w przeglądzie.\nDrzwi elektryczne mają mniejszy obszar wydobycia. niedostępne orze pod rzęsami również pojawiają się czerwone; użyj dużych drzwi lub dostosuj wybór.
beacon_rows=Rozwiązanie: pełne linie po obu stronach
beacon_row_blocked=Beacon jest blokowany. dostosuj ustawienia selekcji lub przeszkód.
beacon_row_unreachable=Drills nie mogą dotrzeć do tego stopnia. dostosuj wybór lub użyj dużych drillów.
choice_beacon_module=Wypełnij automatycznie umieszczone płyny za pomocą tego modułu i jakości.\nDostępne są tylko moduły akceptowane przez biegunkę. moduły ekstrakcji mają oddzielny selektor obok sprzętu.
preview_beacons=Wygląda na Beacons: __1__, pokrywa __2__/__3__ i drillów.
beacon_density_1=Niskie: cel 1 na drill
beacon_density_2=Średnia: cel 2 na drill
beacon_density_4=Tłumaczenie: Target 4 per drill
beacon_density_fill=Wypełnij dostępny przestrzeń
choice_beacon_density=Gęstość Beacon: pożądane wieże, które wpływają na każdy drut; wady do 4.\nKontynuuj dodanie wież po początkowym pokryciu. wypełnij dostępny przestrzeń wykorzystuje każdą dostępną pozycję, która nadal może zapewnić efekty.\nZakrycie godzin, teren, drogi wyjściowe i moc mogą ograniczać gęstość; wspólne wieże mogą przekroczyć cel dla niektórych treningów.\nEfekty używają profilu osłabienia. sprawdź obciążenia pasów po zwiększeniu gęstości.
preview_beacon_density=Każda z nich otrzymuje efekty od __1__ do __2__ i wieży .
choice_remove_entities=Umożliwia: oznaczanie obiektów blokujących do dekonstrukcji na aplikacji; Undo anuluje nowe zamówienia.\nNiepełnosprawne: utrzymywać i unikać obiektów. drzewa, skały, klatki i tereny mają niezależne kontrolę.
dumb_power_connectivity=Użyj uproszczonych połączeń sieciowych
choice_cliff_mode_avoid=Książki z tagiem: unikać\nWrzody, wrzody i połączenia unikają klatków bez rozkazów demolacji.\nKliknij, aby przejść, aby usunąć klipy.
choice_cliff_mode_remove=Książka: Usuń ją\nPozwól rozmieszczenia na skrzydłach; Zastosuj zamówienia demolacji w ramach planowanych odcisków.\nKliknij, aby przejść, aby uniknąć klatek.
choice_terrain_mode_avoid=Woda / lawa / oświetlenie baseny: unikać.\nWrzody, wrzody i połączenia unikać tych płyt bez wypełniania duchów.\nKliknij, aby przejść do wypełnienia.
choice_terrain_mode_fill=Woda / lawa / oświetlenie baseny: wypełnij.\nPozwól rozmieszczenia na terenie wypełnionym; Zastosuj odpowiednie miejsca dla terenów, fundamentów lub platform duchów.\nNiewypełnione płyty pozostają przeszkodami i pojawiają się czerwone, gdy są zablokowane.\nKliknij, aby przejść do unikania.
choice_avoid_obstacles=Unikaj lawy, wody, skał, drzew, skał i istniejących obiektów.\nPrzełamanie i usuwanie przeszkód.\nZatrzymać niebezpieczne połączenia lub schody blokowane placówki.
choice_statistics=Pokaż statystyki layoutowe.\nPo zastosowaniu, wydrukować liczbę drutów, wewnętrzne pasy pasów, płytki zasobowe i zagubione zasoby.\nW trybie ALT wyświetla się szacowana produkcja i wykorzystanie pojemności każdej strony paska, liczba paska wyjściowego i straty butelki w przewidywaniach i zastosowanych układach.\n100% jest pełny; wartości powyżej 100% są czerwone. szacunki pełnej mocy wykorzystują moduły drenażu i pęcherza, produktywność górnictwa i stacking.\nWyłączanie tej opcji zatrzymuje zarówno raporty o pozycjonowaniu, jak i wyświetlacze obciążenia paska; zmienia tylko wyświetlacz, a nie układ.
choice_use_stack_capacity_multiplier=Wykorzystaj badany pojemność paska w przepuszczalniku.\n(Przekierowanie Lua API, aby to zrobić automatycznie dla każdej kopalni górniczej)
label_auto_resource=Automatycznie wykorzystuje ustawienia górnictwa lub ropy naftowej dla wybranych zasobów
label_oil_only_pole=Nie dostępny dla bieżącego układu górniczego; wybierany w trybie oleju.
label_miner_layout_switch=Ten drut nie pasuje do bieżącego układu. Wybierając go przechodzi do kompatybilnego układu.
label_rotate_keybind_tip=Obracaj za pomocą __CONTROL__resource-outpost-planner-keybind-rotate__ lub __CONTROL__resource-outpost-planner-keybind-rotate-reversed__, gdy kursor nie wskazuje obiektu.
label_optional_equipment_toggle=Kliknij, aby włączyć; kliknij ponownie aktywne urządzenie lub prawym kliknięciem, aby wyłączyć.
