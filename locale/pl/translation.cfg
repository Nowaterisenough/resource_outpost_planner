preview_ready=Podgląd: pola złóż – __1__, obiekty – __2__, pola terenu – __3__.
preview_force=Wymuś umieszczenie
preview_force_tooltip=Wymusza umieszczenie jak Shift+kliknięcie i oznacza naturalne przeszkody do rozbiórki. Przy włączonym usuwaniu obiektów lub po Ctrl+Shift+kliknięciu oznacza także kolidujące budynki. Rozbiórkę wykonują roboty. Wypełnianie terenu podlega zasadom schematów gry. Elementy, których nie można umieścić, są czerwone przez 10 sekund.
