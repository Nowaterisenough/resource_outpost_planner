ore_filter_missing=Wybrane obszary nie mają minable __1__Wybierz inne źródło lub obszar.
ore_filter_equipment=W wybranym pasku nie ma rozdzielacza prędkości odpowiadającej.Wybierz inny pasek lub wyłącz filtrowanie zbiornika.
ore_filter_space=Nie wystarczająco dużo jasnego miejsca na izolowane filtracje. dostosowanie selekcji, kontroli terenu lub wyjścia.
