fill_research_warning=Zestaw nie jest odblokowany: __1__.\nMożesz nadal umożliwić tę opcję, przewidywanie i umieszczenie duchów budowlanych. budowa wymaga odpowiednich materiałów; nie przyjmuje się żadnych badań.
