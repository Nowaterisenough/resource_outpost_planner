choice_clear_cliffs=Umożliwia: oznaczanie blokujących klatki do demolcji na aplikacji.\nNiepełnosprawne: utrzymanie i unikanie skał. niezależne od drzew, skał i obiektów.
choice_fill_water=Umożliwia: umieścić odpowiednie wypełnianie duchów pod planowane podmioty na wodzie (platformy lodowe na oceanach amoniaku Aquila).\nNiepełnosprawne: unikać wody. nie zmienia ustawień lawy lub oceanów olejowych.
choice_fill_lava=Umożliwia: umieścić fundamenty duchów pod planowane podmioty na lawie.\nNiepełnosprawne: unikać lawy. nie zmienia ustawień wody lub oceanów naftowych.
choice_fill_oil_ocean=Umożliwia: wypełnić oceany olejowe i modowane baseny oświetleniowe, gdzie istnieje płytka pokrywa.\nNiepełnosprawne: unikać tych płyt. niewypełnione płyty zawsze pozostają przeszkodami.
choice_fill_other=Umożliwia: wypełnij inne pokryte tereny, w tym platformy kosmiczne.\nNiewypełnione pustki i krawędzi map zawsze pozostają przeszkody.
choice_remove_trees=Umożliwia: oznaczanie drzew blokujących do dekonstrukcji na aplikacji.\nNiepełnosprawne: utrzymanie i unikanie drzew. niezależne od obiektów i skał.
choice_remove_rocks=Umożliwia: oznaczanie blokujących skały do dekonstrukcji na aplikacji.\nNiepełnosprawne: utrzymanie i unikanie skał. niezależne od obiektów i drzew.
