tool_select=Zaznacz
tool_select_tooltip=Kliknij i przeciągnij, aby zaznaczyć zasoby. Shift i przeciągnięcie dodają obszar. Kliknij ponownie lub naciśnij __CONTROL__clear-cursor__, aby zakończyć zaznaczanie i zachować podgląd.
