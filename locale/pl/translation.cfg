belt_load_max=Maksymalne obciążenie
belt_load_tooltip=1 oznacza 100%, a 1.1 oznacza 110%. Poniżej średniego minimum taśmociągi są łączone. Po przekroczeniu maksimum na jednej stronie taśmy rzędy są rozdzielane. Słabsze rzędy brzegowe mogą pozostać poniżej minimum. Obliczenia uwzględniają moduły, radionadajniki, badania i piętrowanie przedmiotów. Pierwszeństwo ma liczba wyjść albo wagonów i stron załadunku. Gdy przepustowość jest za mała, plan podaje przewidywaną stratę i nadal można go zastosować. Aby zmienić układ wiertnic, ponownie zaznacz złoże.
belt_load_invalid=Dopuszczalny zakres: 0 ≤ min. ≤ maks. ≤ 100, maks. > 0. Przykład: 0.8 i 1.1 oznaczają 80% i 110%.
belt_capacity_single=Jeden z nich produkuje __1__/s, powyżej dopuszczonego obciążenia dostawcy linii __2__Wybierz szybszy pas, zmniejsz efekty prędkości lub zwiększ maksymalną obciążenie.
belt_capacity_dense=Układ zwarty zostawia dwa pola na taśmociągi. Szacowana strata wydajności: __1__%. Możesz zastosować plan, wybrać szybsze taśmy lub spowolnić wiertnice.
belt_capacity_outputs=Plan zachowuje wybraną liczbę wyjść (__1__). Szacowana strata wydajności: __2__%. Możesz zastosować plan.
belt_capacity_space=Dodatkowe przewody zbioru pozostawiają wcześniej pokryte rzęsy z zakresu górnictwa. Wybierz szerszy patch, wybierz szybszy pas lub zwiększyć maksymalny obciążenie.
belt_capacity_route=Istnieje niewystarczający zasięg podłogowy lub czyszczenie dla niezależnych łańcuchów kolekcyjnych. Wybierz wyższy poziom paska lub dostosuj sprzęt.
belt_capacity_geometry=Wydajność lub geometria portu płynnego tego drutu nie jest wspierana przez rozdzielenie zdolności.
