belt_planner_description=Der Plug-in-Cursor zeigt die aktuellen Ausgangslinien an. Klicken Sie, um ihre Position festzustellen; R / Shift+R dreht den Plug-in. Vorverfolgungsverbindungen werden erst nach Apply erstellt.
