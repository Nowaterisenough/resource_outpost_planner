settings_layout_choice_oil=Öl ausgegeben
choice_beacon=Reservieren Sie kontinuierliche Beacon-Raden auf beiden Seiten jeder Trillkolonne, teilen Sie Raden zwischen angrenzenden Kolonnen.\nUnderground Belt über die Zeilen; Flüssigkeit Eingänge verwenden reservierte Pipe-Kanäle.\nRespektieren Sie ausgewählte Wasser, Cliff und Hindernisse vermeiden; blockierte Reihenfolge Positionen erscheinen rote in der Vorstellung.\nElektrische Trillings haben ein kleineres Berggebiet. Unerreichbares Ore unter den Zeilen erscheint auch rot; Verwenden Sie große Trillings oder angepasst die Auswahl.
beacon_rows=Vereinbarung: Vollstreckungen auf beiden Seiten
beacon_row_blocked=Beacon-Reihe blockiert. Einstellungen der Auswahl oder Hindernisse anpassen.
beacon_row_unreachable=Trillungen können diese Höhe nicht erreichen. Anpassen Sie die Auswahl oder verwenden Sie große Trillungen.
choice_beacon_module=Füllen Sie automatisch gepostete Beacons mit diesem Modul und Qualität.\nNur Module, die vom Beacon akzeptiert werden, sind verfügbar. Extractionsmodule haben neben dem Gerät einen separaten Selektor.
preview_beacons=und Beacons: __1__, abdecken __2__/__3__ und Drills.
beacon_density_1=Niedrig: Ziel 1 pro Trill
beacon_density_2=Medium: Ziel 2 pro Trill
beacon_density_4=Dänse: Ziel 4 pro Drill
beacon_density_fill=Erfüllen Sie den verfügbaren Raum
choice_beacon_density=Beacon-Dichte: gewünschte Türme, die jede Triebe beeinflussen; Defekte auf 4.\nFüllen Sie den verfügbaren Raum mit jeder verfügbaren Position, die noch Effekte bieten kann.\nUhrenoberfläche, Terrain, Ausgangswege und Strom können die Dichte beschränken; gemeinsame Türme können das Ziel für einige Tricks überschreiten.\nEffekte verwenden das native Ermesserungsprofil. Überprüfen Sie die Belastungen des Beltes nach einer erhöhten Dichte.
preview_beacon_density=Jedes Trick bekommt Auswirkungen von __1__ zu __2__ und Türme.
choice_remove_entities=Aktiviert: Markieren Sie die Unterbrechungseinrichtungen auf Apply; Undo kündigt neue Bestellungen ab.\nBehinderte: Behalten und vermeiden Sie Einrichtungen. Bäume, Steine, Klippen und Terrain haben unabhängige Kontrolle.
dumb_power_connectivity=Verwenden Sie vereinfachte Stromnetzverbindungen
choice_cliff_mode_avoid=Klipper: Vermeiden Sie sich\nDrills, Beacons und Verbindungen vermeiden Klippen ohne Demolition Bestellungen.\nKlicken Sie, um zu wechseln, um Cliffs zu entfernen.
choice_cliff_mode_remove=Klipper: Entfernen\nErlauben Sie Layouts über die Klippen; Anwenden Sie Bestellungen Demolition innerhalb der geplanten Fußabdrücke.\nKlicken Sie, um zu wechseln, um Cliffs zu vermeiden.
choice_terrain_mode_avoid=Wasser / Lava / Beleuchtungspoolen: vermeiden.\nDrills, Beacons und Verbindungen vermeiden diese Steile ohne Geister zu füllen.\nKlicken Sie, um zu füllen zu wechseln.
choice_terrain_mode_fill=Wasser / Lava / Beleuchtungspoolen: Füll.\nErlauben Sie Layouts über vollfüllbare Flächen; Anwenden Sie die entsprechenden Landfälle, Fundament oder Plattformgeister.\nUnfüllbare Platten bleiben Hindernisse und erscheinen rot, wenn sie blockiert sind.\nKlicken Sie um zu wechseln, um zu vermeiden.
choice_avoid_obstacles=Vermeiden Sie Lava, Wasser, Klippen, Bäume, Steine und bestehende Einrichtungen.\nÜberschreitende Landfälle und Hindernisse entfernen.\nStoppen Sie unsichere Verbindungen oder schiffe blockierte Placement.
choice_statistics=Layout Statistiken anzeigen.\nNach der Anwendung, Drucken Sie die Trill-Zahl, interne Beltreihen, Ressourcenblätter und vermischte Ressourcen.\nIn ALT-Modus zeigen Sie die geschätzte Produktion und Kapazitätsnutzung der einzelnen Beltseite, die Ausgangsbelastung und das Flaschenverlust in den Vorschlägen und angewandten Layouts.\n100% ist voll; Werte über 100% sind rot. Full-power Schätzungen verwenden Trill und Beacon Module, Mining Produktivität und Stacking.\nDie Deaktivierung dieser Option stoppt sowohl Placement Reports und Belt Load-Displays; ändert nur das Display, nicht die Layout.
choice_use_stack_capacity_multiplier=Verwenden Sie die erforschte Beltstackkapazität in der Durchgangsoberfläche.\n(Lauf der Lua API, um dies automatisch für jeden Bergbau zu tun)
label_auto_resource=Automatisch benutzt man Mining- oder Ölinstellungen für die ausgewählten Ressourcen
label_oil_only_pole=Nicht verfügbar für den aktuellen Bergbau-Layout; in Ölmodus ausgewählbar.
label_miner_layout_switch=Dieser Trick passt nicht zum aktuellen Layout. Wenn Sie ihn auswählen, wechseln Sie zu einem kompatiblen Layout.
