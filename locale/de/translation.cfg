choice_clear_cliffs=Aktiviert: Markieren Sie die Hindernisse für die Demolition auf Apply.\nBehinderte: Erhaltung und Vermeidung von Hügeln. Unabhängig von Bäumen, Steinen und Einrichtungen.
choice_fill_water=Aktiviert: Platzieren Sie geeignete Geister unter geplanten Einheiten auf dem Wasser (Ice-Plattformen in den ammoniakhaften Ozeanen von Aquilo).\nBehinderte: vermeiden Sie Wasser. Änderet nicht die Lava oder Öl-Ozean-Einstellungen.
choice_fill_lava=Aktiviert: Stellen Sie die Stiftung Geister unter geplanten Einheiten auf Lava.\nBehinderte: Vermeiden Sie Lava. Ändert nicht die Wasser- oder Öl-Ozean-Einstellungen.
choice_fill_oil_ocean=Aktiviert: Füllen Sie die Ölzeichen und gemodierte Beleuchtungspoolen, in denen eine Deckungsteile existiert.\nBehinderte: Vermeiden Sie diese Steine. Unfüllbare Steine bleiben immer Hindernisse.
choice_fill_other=Aktiviert: Füllen Sie andere abdeckbare Terre, einschließlich Raumplattformen.\nUnfüllbare Leere und Kartengrenzen bleiben immer Hindernisse.
choice_remove_trees=Aktiviert: Markieren Sie Obstruktionsbäume für die Entfernung auf Apply.\nBehinderte: Behalten und vermeiden Bäume. unabhängig von Einrichtungen und Steinen.
choice_remove_rocks=Aktiviert: Markieren Sie obstruktive Steine für die Entfernung auf Apply.\nBehinderte: Reten und vermeiden Steine. unabhängig von Einrichtungen und Bäumen.
