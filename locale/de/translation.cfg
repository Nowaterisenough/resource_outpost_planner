output_balance_tooltip=Hinzufügen Sie einen Belt-Balanzer an der ausgewählten Ausgangsstelle. Defekte bis zu 8 Ausgangsbelz für vier Lastwagen auf beiden Seiten geladen. Sie können die Anzahl ändern; deaktiviert durch default. Verwenden Sie Ausgang, um die Lage zu wählen und R / Shift+R zu drehen.
output_balance_count_error=Eine ganze Zahl von 1 bis __1__ für die Anzahl der Ausgangsbänder eingeben.
