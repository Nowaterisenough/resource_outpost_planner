belt_load_tooltip=1 entspricht 100 %, 1.1 entspricht 110 %. Unter der Mindestlast werden Sammelbänder zusammengeführt. Überschreitet eine Bandseite die Höchstlast, werden die Reihen geteilt. Schwache Randreihen dürfen unter dem Mindestwert bleiben. Module, Effektverteiler, Forschung und Stapelhöhe gehen in die Schätzung ein. Die gewählte Anzahl der Ausgänge bzw. Wagen und Ladeseiten hat Vorrang. Bei knapper Kapazität zeigt der Plan den erwarteten Verlust an und kann angewendet werden. Für eine neue Anordnung das Erzfeld erneut auswählen.
belt_load_invalid=Gültiger Lastbereich: 0 ≤ Minimum ≤ Maximum ≤ 100, Maximum > 0. Beispiel: 0,8 und 1,1 entsprechen 80 % und 110 %.
belt_capacity_single=Ein Drill produziert __1__/s, über die zulässige Empfangs-Lane Last von __2__Wählen Sie einen schnelleren Belt, reduzieren Sie die Geschwindigkeitseffekte oder erhöhen Sie die maximale Belastung.
belt_capacity_dense=Im kompakten Layout bleiben zwei Felder für die Fließbänder. Geschätzter Durchsatzverlust: __1__ %. Plan anwenden, schnellere Bänder wählen oder Fördertempo senken.
belt_capacity_outputs=Die __1__ gewählten Ausgänge bleiben erhalten. Geschätzter Durchsatzverlust: __2__ %. Der Plan kann angewendet werden.
belt_capacity_space=Zusätzliche Sammelleitungen lassen vorher abgedecktes Gehäuse aus dem Bergbaubereich. Wählen Sie eine engere Patch, wählen Sie einen schnelleren Belt oder erhöhen Sie die maximale Belastung.
belt_capacity_route=Es gibt unzureichend unterirdische Belt Reichweite oder Reinigung für unabhängige Sammelleitungen. Wählen Sie einen höheren Beltgelände oder angepasst die Ausrüstung.
belt_capacity_geometry=Die Ausgangs- oder Fluidport-Geometrie dieses Trillings wird nicht durch Kapazitätsverteilung unterstützt. Ändern Sie die Trillung oder deaktivieren Sie die Verteilung.
