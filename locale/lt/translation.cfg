fill_research_warning=Nėra išjungtas: __1__.\nJūs vis dar galite įgalinti šią parinktį, peržiūrėti ir išdėstyti statybos vaiduoklius. statyba reikalauja atitinkamų medžiagų; nėra mokslinių tyrimų.
