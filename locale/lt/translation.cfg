choice_clear_cliffs=Įjungta: žymėkite klipas, trukdančias demoliuoti ant Apply.\nSu neįgaliu: išlaikyti ir išvengti kalvų. Nepriklausomai nuo medžių, uolų ir įrenginių.
choice_fill_water=Įjungta: tinkamai užpildyti vaiduoklius planuojamose būtybėse ant vandens (šviesos platformos Amoniako vandenyse).\nNepakankamas: vengti vandens. nesikeičia lavos ar naftos vandenynų nustatymų.
choice_fill_lava=Įjungta: įdėti fondijos vaiduoklius pagal planuojamus subjektus ant lavos.\nSu negalia: vengti lavos.Nepakeičia vandens ar naftos vandenynų nustatymų.
choice_fill_oil_ocean=Įjungta: užpildykite naftos vandenynus ir modduotus šviesos baseinus, kur egzistuoja dangtelio plokštė.\nSu neįgaliu: vengti šių plytelių. nepakankamos plytelės visada lieka kliūtis.
choice_fill_other=Įjungta: užpildykite kitus padengti plotus, įskaitant erdvės platformas.\nNesugebėjimas užpildyti ir žemėlapio ribos visada lieka kliūtimis.
choice_remove_trees=Leidžiama: žymėti stabdžius medžius dekonstrukcijai ant Taikymo.\nSu neįgaliu: išlaikyti ir išvengti medžių. Nepriklausomai nuo įrenginių ir akmenų.
choice_remove_rocks=Įjungta: pažymėkite kliūčių akmenis dekonstrukcijai ant Taikymo.\nSu neįgaliu: išsaugoti ir vengti akmenų. nepriklausomai nuo įrenginių ir medžių.
