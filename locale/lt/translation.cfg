belt_load_tooltip=1 reiškia 100 %, o 1.1 – 110 %. Kai vidutinė apkrova mažesnė už minimumą, konvejeriai sujungiami. Kai vienos pusės apkrova viršija maksimumą, eilės padalijamos. Kraštinių eilių apkrova gali likti maža. Skaičiuojama pagal modulius, siųstuvų aprėptį, tyrimus ir daiktų krovimą į krūvas. Pirmenybė teikiama nustatytam išėjimų arba vagonų ir krovimo pusių skaičiui. Jei pralaidumo nepakanka, rodomas numatomas nuostolis ir planą vis tiek galima taikyti. Norėdami keisti išdėstymą, iš naujo pažymėkite telkinį.
belt_load_invalid=Leistina apkrova: 0 ≤ min. ≤ maks. ≤ 100, maks. > 0. Pavyzdžiui, 0.8 ir 1.1 atitinka 80 % ir 110 %.
belt_capacity_single=Vienas šaknis gamina __1__/s, virš leistino gaunamojo lėktuvo apkrovos __2__Pasirinkite greitesnį juostą, sumažinkite greičio poveikį arba padidinkite didžiausią apkrovą.
belt_capacity_dense=Kompaktiškame išdėstyme konvejeriams lieka du langeliai. Numatomas našumo nuostolis: __1__ %. Galite taikyti planą, rinktis greitesnius konvejerius arba mažinti grąžtų greitį.
belt_capacity_outputs=Išlaikomas nustatytas išėjimų skaičius (__1__). Numatomas našumo nuostolis: __2__ %. Planą galima taikyti.
belt_capacity_space=Papildomos surinkimo linijos palieka anksčiau apdovanotas uogas iš kasybos diapazono. Pasirinkite siauresnį patch, pasirinkite greitesnį juostą arba padidinkite didžiausią apkrovą.
belt_capacity_route=Yra nepakankamas požeminio dirvožemio juostos plotis ar valymas nepriklausomoms surinkimo linijoms. Pasirinkite aukštesnį dirvožemio lygį arba pritaikykite įrangą.
belt_capacity_geometry=Šio drėkinimo išleidimas arba skysčio uosto geometrija nėra palaikoma pajėgumo suskaidymu. keiskite drėkinimą arba neleidžiate suskaidyti.
