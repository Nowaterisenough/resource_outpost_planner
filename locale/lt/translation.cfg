settings_layout_choice_oil=Naftos išleidimas
choice_beacon=Užsisakykite nuolatines beacon eilutes iš abiejų pusių kiekvieno gręžimo stulpelio, dalijasi eilutėmis tarp artėjančių stulpelių.\nŽemės dirvožemio juostos peržengia eilutes; skysčių įvedimai naudoja rezervuotus vamzdžių kanalus.\nAtsižvelgti į pasirinktą vandenį, klipas ir kliūčių vengimas; blokuotos eilutės pozicijos rodomos iš anksto.\nElektriniai gręžimai turi mažesnį kasybos plotą. nepasiekiamas gręžimas po eilutėmis taip pat atrodo raudonas; naudokite didelius gręžimus arba pritaikykite pasirinkimą.
beacon_rows=Susitarimas: pilnas eilutes abiejose pusėse
beacon_row_blocked=Beacon eilutė blokuota. pritaikyti pasirinkimo arba kliūčių nustatymus.
beacon_row_unreachable=Drilės negali pasiekti šios eros. pritaikyti pasirinkimą arba naudoti didelius drilės.
choice_beacon_module=Automatiškai užpildykite įdėtas beacons su šiuo moduliu ir kokybe.\nGalimi tik beakono priimti moduliai. ekstrakcijos moduliai turi atskirą selektorių šalia įrangos.
preview_beacons=Beaconų žodžiai : __1__Apdaila __2__/__3__ ir drąsų.
beacon_density_1=Žemas: tikslas 1 per drilę
beacon_density_2=Vidutinis: tikslas 2 per drilę
beacon_density_4=Žyma: tikslas 4 per drilę
beacon_density_fill=Užpildykite turimą erdvę
choice_beacon_density=Beacon tankumas: pageidaujami bokštai, turintys įtakos kiekvienam šakniui; numatyta iki 4.\nToliau pridėti bokštus po pradinio aprėpties. Užpildykite turimą erdvę naudoja kiekvieną turimą poziciją, kuri vis dar gali suteikti poveikį.\nLaikrodžio aprėptis, žemė, išeinantys maršrutai ir elektros energijos gali apriboti tankį; bendrieji bokštai gali viršyti tikslą kai kuriems treniruotėms.\nEfektai naudoja gimtojo slopinimo profilį. patikrinti juostos apkrovą po padidėjusio tankio.
preview_beacon_density=Kiekvienas iš jų gauna poveikį nuo __1__ į __2__ ir bokštus.
choice_remove_entities=Įjungta: apibūdinti dekonstrukcijos įrenginius ant Taikymo; Undo atšaukia naujus užsakymus.\nNepakankamas: išlaikyti ir išvengti pastatų. Medžiai, uolai, kalnai ir grindys turi nepriklausomą kontrolę.
dumb_power_connectivity=Naudokite supaprastintus elektros tinklų ryšius
choice_cliff_mode_avoid=Kiaulės: išvengti\nDrilės, beakonai ir ryšiai vengia klipas be demolicijos užsakymų.\nPaspauskite, kad pasikeittumėte ir pašalintumėte klipas.
choice_cliff_mode_remove=Riebalai – ištrinkite\nLeiskite išdėstyti per klipas; Taikykite užsakymus demolicija pagal planuojamus pėdsakus.\nPaspauskite, kad išvengtumėte klifų.
choice_terrain_mode_avoid=Vanduo / lava / šviesos baseinai: vengti.\nDrilės, beakonai ir ryšiai išvengia šių plytelių be sielų užpildymo.\nPaspauskite, kad pereitumėte prie užpildymo.
choice_terrain_mode_fill=Vanduo / lava / šviesos baseinai: užpildykite.\nLeiskite išdėstyti per užpildytą žemę; Taikykite atitinkamus kraštovaizdį, pagrindą ar platformos vaiduoklius.\nNepilnaverti plokštės lieka kliūtis ir rožinis pasirodo, kai blokuojamas.\nPaspauskite, kad pasikeittumėte, kad išvengtumėte
choice_avoid_obstacles=Venkite lavos, vandens, kalvų, medžių, uolų ir esamų įrenginių.\nPeržengia kraštovaizdį ir kliūčių pašalinimą.\nSustabdyti nesaugius ryšius ar laivus blokuoti plokštės.
choice_statistics=Parodykite statistinius statistinius duomenis.\nPo taikymo, spausdinkite drėkinimo skaičių, vidaus juostų eilutes, išteklių plokštes ir praleistus išteklius.\nALT režimu rodomas kiekvienos juostos pusės apskaičiuotas gamybos ir pajėgumo panaudojimas, išleidimo juostos skaičiavimas ir buteliuko praradimas išankstinėse apžvalgoje ir taikomose išdėstymuose.\n100% yra pilnas; vertybės virš 100% yra raudonos. pilna jėga apskaičiavimai naudoja drėkinimo ir beacon modulius, kasybos produktyvumą ir stygą.\nIšjungti šią parinktį sustabdo tiek pozicionavimo ataskaitas ir juostos apkrovos ekranus; pakeisti tik ekraną, o ne išdėstymą.
choice_use_stack_capacity_multiplier=Naudokite ištirtą juostų stack pajėgumą perėjimo į viršutinę dalį.\n(Plaukite Lua API, kad tai padarytumėte automatiškai kiekvienam kasybos grindų)
