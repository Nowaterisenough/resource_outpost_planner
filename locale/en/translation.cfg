choice_none=None
choice_beacon=Reserve continuous beacon rows on both sides of every drill column, sharing rows between adjacent columns.\nUnderground belts cross the rows; fluid inputs use reserved pipe channels.\nRespect selected water, cliff and obstacle avoidance; blocked row positions appear red in the preview.\nElectric drills have a smaller mining area. Unreachable ore underneath the rows also appears red; use big drills or adjust the selection.
beacon_rows=Arrangement: full rows on both sides
beacon_row_blocked=Beacon row blocked. Adjust the selection or obstacle settings.
beacon_row_unreachable=Drills cannot reach this ore. Adjust the selection or use big drills.
choice_beacon_module=Fill automatically placed beacons with this module and quality.\nOnly modules accepted by the beacon are available. Extraction modules have a separate selector beside the equipment.
preview_beacons=Beacons: __1__, covering __2__/__3__ drills.
beacon_density_1=Low: target 1 per drill
beacon_density_2=Medium: target 2 per drill
beacon_density_4=Dense: target 4 per drill
beacon_density_fill=Fill available space
choice_beacon_density=Beacon density: desired towers affecting each drill; defaults to 4.\nContinue adding towers after initial coverage. Fill available space uses every available position that can still provide effects.\nOre coverage, terrain, output routes and power may limit density; shared towers can exceed the target for some drills.\nEffects use the native attenuation profile. Check belt loads after increasing density.
preview_beacon_density=Each drill receives effects from __1__ to __2__ towers.
choice_none_zero=No power pole gap
choice_lamp=Place lamps
choice_coverage=Place more drills.\nPlace drills more readily along patch edges and sparse areas, allowing more overlap between mining ranges.\nCan increase the number of drills mining at once, at the cost of more equipment and belts.
choice_landfill=Omit landfill
choice_start=Align to patch start
choice_deconstruction=Keep existing facilities, trees and rocks.\nCliff removal and terrain filling follow their own mode controls.
dumb_power_connectivity=Use simplified power network connections
choice_ore_filtering=Omit miners on unwanted trace ores
choice_avoid_water=Avoid placement on water
choice_avoid_cliffs=Avoid placement on cliffs
choice_cliff_mode_avoid=Cliffs: avoid.\nDrills, beacons and connections avoid cliffs without demolition orders.\nClick to switch to removing cliffs.
choice_cliff_mode_remove=Cliffs: remove.\nAllow layouts across cliffs; Apply orders demolition within the planned footprints.\nClick to switch to avoiding cliffs.
choice_terrain_mode_avoid=Water / lava / lightning pools: avoid.\nDrills, beacons and connections avoid these tiles without fill ghosts.\nClick to switch to filling.
choice_terrain_mode_fill=Water / lava / lightning pools: fill.\nAllow layouts across fillable terrain; Apply places the appropriate landfill, foundation or platform ghosts.\nUnfillable tiles remain obstacles and appear red when blocked.\nClick to switch to avoiding.
choice_avoid_obstacles=Avoid lava, water, cliffs, trees, rocks and existing facilities.\nOverrides landfill and obstacle removal.\nStops unsafe connections or skips blocked placements.
choice_force_pipe_placement=Force pipe placement
choice_statistics=Show layout statistics.\nAfter Apply, print drill count, internal belt rows, resource tiles and missed resources.\nIn ALT mode, show each belt side's estimated production and capacity usage, output belt count and bottleneck loss in previews and applied layouts.\n100% is full; values above 100% are red. Full-power estimates use drill and beacon modules, mining productivity and stacking.\nDisabling this option stops both placement reports and belt load displays; changes the display only, not the layout.
choice_merge_belts=Merge low yield belts
choice_belt_planner=Click to enter output placement mode. The blueprint cursor shows one belt per output lane.\nUse __CONTROL__build__ to set or move the output; R / Shift+R rotate it.\nClick again or press __CONTROL__clear-cursor__ to exit, keeping the chosen output.\nConnections follow the selected terrain and obstacle settings and are built after Apply.\nRequires a mining preview with output belts, or the most recently applied mining layout.
choice_use_stack_capacity_multiplier=Use researched belt stack capacity in throughput overlay.\n(pending Lua API to do this automatically for each mining drill)

