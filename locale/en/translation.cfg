[mod-name]
mining-patch-planner=Resource Outpost Planner

[mod-description]
mining-patch-planner=Plan mining patches and oil outposts with a robot-safe ground preview. Adjust settings live, avoid obstacles, and apply construction ghosts when ready.

[item-name]
mining-patch-planner=Resource Outpost Planner

[item-description]
mining-patch-planner=Select resources with __CONTROL__build__ to preview a mining or oil layout.\nAdjust settings to update the preview, then click Apply to place construction ghosts. Robots cannot build the preview.\nAdd resources with __CONTROL_KEY_SHIFT____CONTROL_STYLE_BEGIN__ + __CONTROL_STYLE_END____CONTROL__build__. Cancel Preview discards only the draft.

