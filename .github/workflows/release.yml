name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check and package only (uncheck to publish both releases)'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test runtime
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline regressions
        run: python scripts/check-release.py
      - name: Prepare next version and build release files
        run: python scripts/release.py prepare --output dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
      - name: Write summary
        run: |
          cat dist/release/notes.md >> "$GITHUB_STEP_SUMMARY"
          printf '\nPackage checksums:\n```\n' >> "$GITHUB_STEP_SUMMARY"
          cat dist/release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish GitHub and Factorio releases
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check Factorio credential
        env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
        run: |
          if [ -z "$FACTORIO_API_KEY" ]; then
            echo '::error::Add the FACTORIO_API_KEY repository secret with ModPortal: Upload Mods permission.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}
          path: dist/release
      - name: Publish verified archive
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
        run: python scripts/release.py publish --output dist/release
      - name: Write publication receipt
        run: cat dist/release/published.md >> "$GITHUB_STEP_SUMMARY"
